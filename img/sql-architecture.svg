<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -58.75 1400 787.5" width="1400" height="787.5" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Local: Blazor app and Copilot agent talk to one DAB; DAB talks to one SQL Server 2025 container; SQL calls a local Ollama model via Caddy.">
  <style>
    .box        { fill:#1a2147; stroke:#2a3360; stroke-width:1.5; }
    .box-sql    { fill:#2a1118; stroke:#cc2936; }
    .box-dab    { fill:#0f1a3a; stroke:#2563eb; }
    .box-agent  { fill:#1d1535; stroke:#8b5cf6; }
    .box-ai     { fill:#0a2231; stroke:#0ea5e9; }
    .box-browser{ fill:#15212e; stroke:#64748b; }
    .label-title  { fill:#e8ecf8; font-weight:700; font-size:17px; font-family:'Segoe UI', system-ui, sans-serif; }
    .label-sub    { fill:#a9b3d6; font-size:13px; font-family:'Segoe UI', system-ui, sans-serif; }
    .label-mono   { fill:#e8ecf8; font-size:13.5px; font-family:Consolas, 'Courier New', monospace; }
    .label-mono-d { fill:#a9b3d6; font-size:12.5px; font-family:Consolas, 'Courier New', monospace; }
    .badge        { fill:#e8ecf8; font-size:13px; font-weight:700; font-family:'Segoe UI', system-ui, sans-serif; }
    .edge        { fill:none; stroke-width:2; }
    .edge-rest   { stroke:#16a34a; }
    .edge-mcp    { stroke:#d97706; }
    .edge-sql    { stroke:#cc2936; stroke-dasharray:4 3; }
    .edge-ai     { stroke:#0ea5e9; stroke-dasharray:2 3; }
    .edge-write  { stroke:#a9b3d6; stroke-dasharray:6 3; }
    .edge-label  { fill:#e8ecf8; font-size:13px; font-weight:600; font-family:'Segoe UI', system-ui, sans-serif; }
    .pill { fill:#0b1020; stroke:#2a3360; stroke-width:1; }
  </style>
  <defs>
    <marker id="arr-rest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a" /></marker>
    <marker id="arr-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706" /></marker>
    <marker id="arr-sql" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cc2936" /></marker>
    <marker id="arr-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9" /></marker>
    <marker id="arr-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9b3d6" /></marker>
  </defs>

  <!-- background -->
  <rect x="0" y="-58.75" width="1400" height="787.5" fill="#0b1020"/>

  <!-- page title -->
  <text x="40" y="-28" fill="#e8ecf8" font-weight="700" font-size="22" font-family="'Segoe UI', system-ui, sans-serif">Zava Live Site Support — Architecture (Local)</text>
  <text x="40" y="-8" fill="#a9b3d6" font-size="14" font-family="'Segoe UI', system-ui, sans-serif">App + Agent → one DAB → one SQL → local model</text>

  <!-- Left: clients -->
  <rect class="box box-browser" x="40" y="80" width="240" height="100" rx="10" ry="10"/>
  <text class="label-title"  x="60" y="112">Zava On-Call app</text>
  <text class="label-sub"    x="60" y="132">Blazor WASM · Aspire</text>
  <text class="label-mono-d" x="60" y="158">localhost:8080</text>

  <rect class="box box-agent" x="40" y="240" width="240" height="100" rx="10" ry="10"/>
  <text class="label-title"  x="60" y="272">Copilot agent</text>
  <text class="label-sub"    x="60" y="292">VS Code · agent mode</text>
  <text class="label-mono-d" x="60" y="318">six MCP tools</text>
  <text class="label-mono-d" x="40" y="360">.github/skills/live-site-sql/SKILL.md</text>

  <!-- Middle: DAB -->
  <rect class="box box-dab" x="340" y="100" width="320" height="260" rx="10" ry="10"/>
  <text class="label-title"  x="360" y="124">Data API builder</text>
  <text class="label-title"  x="360" y="144">SQL MCP Server</text>
  <text class="label-sub"    x="360" y="162">one config · localhost:8765</text>
  <rect class="pill" x="360" y="170" width="280" height="50" rx="12" ry="12"/>
  <text class="label-mono"   x="374" y="192">/api</text>
  <text class="label-mono-d" x="374" y="210">Incident (table)</text>
  <rect class="pill" x="360" y="232" width="280" height="116" rx="12" ry="12"/>
  <text class="label-mono"   x="374" y="254">/mcp</text>
  <text class="label-mono-d" x="374" y="274">read_records · hybrid_search</text>
  <text class="label-mono-d" x="374" y="292">dx_index_exists</text>
  <text class="label-mono-d" x="374" y="310">dx_resource_pressure</text>
  <text class="label-mono-d" x="374" y="328">dx_deadlock_recent</text>
  <text class="label-mono-d" x="374" y="344">generate_mitigation</text>

  <!-- Right: SQL container -->
  <rect class="box box-sql" x="700" y="60" width="680" height="560" rx="10" ry="10"/>
  <text class="label-title"  x="720" y="92">Azure SQL container</text>
  <text class="label-sub"    x="720" y="110">localhost,14330 · zavalivesitedb</text>

  <!-- Left column inside the container: SQL surface -->
  <rect class="pill" x="750" y="130" width="240" height="76" rx="12" ry="12"/>
  <text class="label-mono"   x="766" y="152">CORPUS</text>
  <text class="label-mono-d" x="766" y="170">Incident · Archive · Runbook</text>
  <text class="label-mono-d" x="766" y="188">vector(1024) · JSON · DiskANN</text>

  <rect class="pill" x="750" y="218" width="240" height="76" rx="12" ry="12"/>
  <text class="label-mono"   x="766" y="240">LIVE STATE (DMVs)</text>
  <text class="label-mono-d" x="766" y="258">sys.indexes · schedulers</text>
  <text class="label-mono-d" x="766" y="276">xe deadlock_report</text>

  <rect class="pill" x="750" y="306" width="240" height="60" rx="12" ry="12"/>
  <text class="label-mono"   x="766" y="326">EXTERNAL MODEL</text>
  <text class="label-mono-d" x="766" y="344">OllamaMxbai</text>
  <text class="label-mono-d" x="766" y="360">→ embeddings via Ollama</text>

  <rect class="pill" x="750" y="378" width="240" height="44" rx="12" ry="12"/>
  <text class="label-mono"   x="766" y="398">LEDGER</text>
  <text class="label-mono-d" x="766" y="414">AppLog · append-only · Merkle</text>

  <rect class="pill" x="750" y="434" width="240" height="102" rx="12" ry="12"/>
  <text class="label-mono"   x="766" y="454">COMPOSER</text>
  <text class="label-mono-d" x="766" y="472">usp_GenerateMitigation</text>
  <text class="label-mono-d" x="766" y="490">→ usp_HybridSearch · embed</text>
  <text class="label-mono-d" x="766" y="508">→ sp_invoke chat</text>
  <text class="label-mono-d" x="766" y="526">→ UPDATE Incident + AppLog</text>

  <!-- Right column inside the container: AI side-cars -->
  <rect class="box box-ai" x="1080" y="130" width="280" height="316" rx="10" ry="10"/>
  <text class="label-title"  x="1100" y="156">LOCAL AI</text>
  <text class="label-sub"    x="1100" y="174">in-container side-cars</text>

  <rect class="pill" x="1100" y="186" width="240" height="104" rx="12" ry="12"/>
  <text class="label-mono"   x="1114" y="206">Caddy + Ollama</text>
  <text class="label-mono-d" x="1114" y="224">HTTPS :8444 → :11434</text>
  <text class="label-mono-d" x="1114" y="242">loopback only</text>
  <text class="label-mono-d" x="1114" y="258">OLLAMA_KEEP_ALIVE=-1</text>
  <text class="label-mono-d" x="1114" y="276">same process as sqlservr</text>

  <rect class="pill" x="1100" y="300" width="240" height="64" rx="12" ry="12"/>
  <text class="label-mono"   x="1114" y="320">EMBEDDINGS</text>
  <text class="label-mono-d" x="1114" y="338">mxbai-embed-large (1024)</text>
  <text class="label-mono-d" x="1114" y="354">EXTERNAL MODEL target</text>

  <rect class="pill" x="1100" y="374" width="240" height="64" rx="12" ry="12"/>
  <text class="label-mono"   x="1114" y="394">CHAT</text>
  <text class="label-mono-d" x="1114" y="412">phi4</text>
  <text class="label-mono-d" x="1114" y="428">sp_invoke target</text>

  <!-- Edges -->
  <path class="edge edge-rest" d="M280,130 C300,130 320,195 340,195" marker-end="url(#arr-rest)"/>
  <text class="edge-label" x="290" y="122" fill="#16a34a">REST</text>

  <path class="edge edge-mcp" d="M280,290 C300,290 320,285 340,285" marker-end="url(#arr-mcp)"/>
  <text class="edge-label" x="290" y="278" fill="#d97706">MCP</text>

  <path class="edge edge-sql" d="M660,230 C680,230 690,170 700,170" marker-end="url(#arr-sql)"/>
  <text class="edge-label" x="668" y="208" fill="#cc2936">TDS</text>

  <path class="edge edge-ai" d="M990,336 C1030,336 1040,332 1080,332" marker-end="url(#arr-ai)"/>
  <text class="edge-label" x="1018" y="326" fill="#0ea5e9">embed</text>
  <path class="edge edge-ai" d="M990,485 C1030,485 1040,406 1080,406" marker-end="url(#arr-ai)"/>
  <text class="edge-label" x="1018" y="448" fill="#0ea5e9">chat</text>

  <path class="edge edge-write" d="M750,520 C720,520 720,170 750,170" marker-end="url(#arr-write)"/>
  <path class="edge edge-write" d="M750,500 C725,500 725,400 750,400" marker-end="url(#arr-write)"/>

  <text class="badge" x="740" y="50" fill="#e8ecf8">READ → EMBED → CHAT → WRITE-BACK</text>
</svg>
